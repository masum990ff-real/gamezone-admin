<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Game Zone Admin — Notifications</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #050505; }
  .card { background: #14161B; border: 1px solid #262B33; }
  .accent { color: #FF7A00; }
  .nav-active { background: #1C1214; border-color: #FF7A00 !important; color: #FF7A00; }
  .btn-primary { background: #00E676; color: #06110B; }
  .btn-primary:disabled { opacity: .5; }
  .field { background: #0B0D10; border: 1px solid #2A2E35; color: #F2F4F7; }
  table th, table td { padding: 10px 12px; text-align: left; }
</style>
</head>
<body class="min-h-screen text-gray-100">
<div class="flex min-h-screen">
  <aside class="w-56 shrink-0 border-r border-gray-800 p-4 flex flex-col gap-2">
    <h1 class="text-xl font-extrabold tracking-wide px-2 mb-4">GAME <span class="accent">ZONE</span></h1>
    <a href="index.html" class="rounded-lg px-3 py-2 border border-transparent text-gray-300 hover:bg-gray-900">Dashboard</a>
    <a href="users.html" class="rounded-lg px-3 py-2 border border-transparent text-gray-300 hover:bg-gray-900">Users</a>
    <a href="notifications.html" class="nav-active rounded-lg px-3 py-2 border border-transparent">Notifications</a>
    <button id="logoutBtn" class="mt-auto rounded-lg px-3 py-2 text-left text-gray-400 hover:bg-gray-900">Logout</button>
  </aside>
  <main class="flex-1 p-6">
    <h2 class="text-2xl font-bold mb-6">Notifications</h2>
    <div id="errorBox" class="hidden mb-4 text-sm text-red-300 bg-red-950 border border-red-800 rounded-lg px-3 py-2"></div>
    <div id="okBox" class="hidden mb-4 text-sm text-green-300 bg-green-950 border border-green-800 rounded-lg px-3 py-2"></div>
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 mb-8">
      <div class="card rounded-2xl p-5">
        <h3 class="font-bold mb-3">Send broadcast to all users</h3>
        <label class="block text-sm text-gray-400 mb-1" for="tplPicker">Template (fills the form)</label>
        <select id="tplPicker" class="field rounded-lg w-full px-3 py-2 mb-4 text-sm">
          <option value="">— No template —</option>
        </select>
        <label class="block text-sm text-gray-400 mb-1" for="title">Title</label>
        <input id="title" type="text" class="field rounded-lg w-full px-3 py-2 mb-4 text-sm" placeholder="Tournament starting soon" />
        <label class="block text-sm text-gray-400 mb-1" for="body">Message</label>
        <textarea id="body" rows="3" class="field rounded-lg w-full px-3 py-2 mb-4 text-sm" placeholder="Room opens in 10 minutes..."></textarea>
        <label class="block text-sm text-gray-400 mb-1" for="imageUrl">Image URL (optional)</label>
        <input id="imageUrl" type="text" class="field rounded-lg w-full px-3 py-2 mb-4 text-sm" placeholder="https://..." />
        <label class="flex items-center gap-2 text-sm text-gray-300 mb-4">
          <input id="saveTpl" type="checkbox" class="w-4 h-4" /> Save as template after sending
        </label>
        <button id="sendBtn" class="btn-primary font-bold rounded-xl w-full py-3">Send to all users</button>
      </div>
      <div class="card rounded-2xl p-5">
        <h3 class="font-bold mb-3">Saved templates</h3>
        <div id="tplList" class="text-sm text-gray-300">Loading...</div>
      </div>
    </div>
    <div class="card rounded-2xl p-5">
      <h3 class="font-bold mb-3">History</h3>
      <div class="overflow-x-auto">
        <table class="w-full text-sm">
          <thead class="text-gray-400">
            <tr class="border-b border-gray-800"><th>Title</th><th>Message</th><th>Sent at</th><th>Sent by</th><th>Sent</th><th>Failed</th></tr>
          </thead>
          <tbody id="histRows"><tr><td colspan="6" class="text-gray-500">Loading...</td></tr></tbody>
        </table>
      </div>
      <div class="flex items-center gap-3 mt-4 text-sm">
        <button id="prevBtn" class="card rounded-lg px-4 py-2">Previous</button>
        <span id="pageInfo" class="text-gray-400">Page 1</span>
        <button id="nextBtn" class="card rounded-lg px-4 py-2">Next</button>
      </div>
    </div>
  </main>
</div>
<script src="api.js"></script>
<script>
  Api.requireAuth();
  document.getElementById('logoutBtn').addEventListener('click', () => Api.logout());
  const errorBox = document.getElementById('errorBox');
  const okBox = document.getElementById('okBox');
  const titleEl = document.getElementById('title');
  const bodyEl = document.getElementById('body');
  const imageEl = document.getElementById('imageUrl');
  const saveTplEl = document.getElementById('saveTpl');
  const sendBtn = document.getElementById('sendBtn');
  const tplPicker = document.getElementById('tplPicker');
  const tplList = document.getElementById('tplList');
  const histRows = document.getElementById('histRows');
  const pageInfo = document.getElementById('pageInfo');
  let templates = [];
  let page = 1;
  const LIMIT = 20;
  let total = 0;

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.remove('hidden');
  }
  function showOk(msg) {
    okBox.textContent = msg;
    okBox.classList.remove('hidden');
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function fmtDate(v) {
    if (!v) return '—';
    const d = new Date(v);
    return isNaN(d) ? '—' : d.toLocaleString();
  }
  async function loadTemplates() {
    try {
      templates = await Api.get('/notifications/templates');
      tplPicker.innerHTML = '<option value="">— No template —</option>' + templates.map((t) =>
        '<option value="' + esc(t.id) + '">' + esc(t.title) + '</option>').join('');
      tplList.innerHTML = templates.length ? '<ul class="space-y-2">' + templates.map((t) =>
        '<li class="flex justify-between items-start border-b border-gray-800 pb-2"><span><b>' +
        esc(t.title) + '</b><br/><span class="text-gray-400">' + esc(t.body) + '</span></span>' +
        '<button data-deltpl="' + esc(t.id) + '" class="text-red-400 underline ml-3">Delete</button></li>').join('') + '</ul>'
        : 'No templates yet. Tick "Save as template" when sending to reuse a message.';
      tplList.querySelectorAll('[data-deltpl]').forEach((btn) =>
        btn.addEventListener('click', () => deleteTemplate(btn.getAttribute('data-deltpl'))));
    } catch (err) {
      showError(err.message);
    }
  }
  async function deleteTemplate(id) {
    if (!window.confirm('Delete this template?')) return;
    try {
      await Api.del('/notifications/templates/' + encodeURIComponent(id));
      loadTemplates();
    } catch (err) {
      showError(err.message);
    }
  }
  tplPicker.addEventListener('change', () => {
    const t = templates.find((x) => x.id === tplPicker.value);
    if (t) {
      titleEl.value = t.title || '';
      bodyEl.value = t.body || '';
      imageEl.value = t.imageUrl || '';
    }
  });
  sendBtn.addEventListener('click', async () => {
    errorBox.classList.add('hidden');
    okBox.classList.add('hidden');
    sendBtn.disabled = true;
    sendBtn.textContent = 'Sending...';
    try {
      const payload = { title: titleEl.value.trim(), body: bodyEl.value.trim() };
      if (imageEl.value.trim()) payload.imageUrl = imageEl.value.trim();
      const result = await Api.post('/notifications/send', payload);
      if (saveTplEl.checked) {
        await Api.post('/notifications/templates', payload);
        loadTemplates();
      }
      showOk('Broadcast sent. Accepted: ' + result.successCount + ', failed: ' + result.failureCount + '.');
      titleEl.value = '';
      bodyEl.value = '';
      loadHistory();
    } catch (err) {
      showError(err.message);
    } finally {
      sendBtn.disabled = false;
      sendBtn.textContent = 'Send to all users';
    }
  });
  async function loadHistory() {
    histRows.innerHTML = '<tr><td colspan="6" class="text-gray-500">Loading...</td></tr>';
    try {
      const data = await Api.get('/notifications/history?page=' + page + '&limit=' + LIMIT);
      total = data.total;
      pageInfo.textContent = 'Page ' + data.page + ' of ' + Math.max(1, Math.ceil(total / LIMIT)) + ' (' + total + ')';
      histRows.innerHTML = data.notifications.length ? data.notifications.map((n) =>
        '<tr class="border-b border-gray-800"><td>' + esc(n.title) + '</td><td class="text-gray-400">' +
        esc(n.body) + '</td><td class="text-gray-400">' + esc(fmtDate(n.sentAt)) + '</td><td>' +
        esc(n.sentBy) + '</td><td class="text-green-400">' + n.successCount + '</td><td class="text-red-400">' +
        n.failureCount + '</td></tr>').join('')
        : '<tr><td colspan="6" class="text-gray-500">No broadcasts yet.</td></tr>';
    } catch (err) {
      showError(err.message);
    }
  }
  document.getElementById('prevBtn').addEventListener('click', () => { if (page > 1) { page -= 1; loadHistory(); } });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if (page * LIMIT < total) { page += 1; loadHistory(); }
  });
  loadTemplates();
  loadHistory();
</script>
</body>
</html>
