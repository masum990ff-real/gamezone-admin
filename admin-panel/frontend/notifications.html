<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Game Zone Admin — Notifications</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<div class="layout">
  <aside class="sidebar" aria-label="Admin navigation">
    <div class="brand">GAME <b>ZONE</b></div>
    <a href="index.html" class="navlink"><span data-icon="dashboard"></span>Dashboard</a>
    <a href="users.html" class="navlink"><span data-icon="users"></span>Users</a>
    <a href="notifications.html" class="navlink active"><span data-icon="bell"></span>Notifications</a>
    <button id="logoutBtn" class="navlink" style="margin-top:auto;background:none;border:none;cursor:pointer;text-align:left;width:100%"><span data-icon="logout"></span>Logout</button>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <div class="topbar">
      <button id="menuBtn" class="btn btn-secondary btn-sm menu-btn" aria-label="Open navigation">Menu</button>
      <h2>Notifications</h2>
    </div>
    <p class="page-sub">Broadcasts go to every installed device via the all_users topic.</p>
    <div id="errorBox" class="inline-err" style="display:none"></div>
    <div class="cols-2" style="margin-bottom:18px">
      <div class="glass card" style="margin-bottom:0">
        <h3 class="card-title">Send broadcast to all users</h3>
        <div class="field-row">
          <label class="label" for="tplPicker">Template (fills the form)</label>
          <div class="select-wrap"><select id="tplPicker" class="field"><option value="">— No template —</option></select></div>
        </div>
        <div class="field-row">
          <label class="label" for="title">Title</label>
          <input id="title" type="text" class="field" maxlength="200" placeholder="Tournament starting soon" />
          <div class="char-count"><span id="titleCount">0</span>/200</div>
        </div>
        <div class="field-row">
          <label class="label" for="body">Message</label>
          <textarea id="body" rows="3" class="field" maxlength="2000" placeholder="Room opens in 10 minutes..."></textarea>
          <div class="char-count"><span id="bodyCount">0</span>/2000</div>
        </div>
        <div class="field-row">
          <label class="label" for="imageUrl">Image URL (optional, https only)</label>
          <input id="imageUrl" type="url" inputmode="url" class="field" placeholder="https://..." />
          <img id="imgPreview" class="thumb" alt="Image preview" />
          <div class="helper" id="imgHint">A small preview appears when the URL loads.</div>
        </div>
        <label class="toggle"><input id="saveTpl" type="checkbox" /><span class="track" aria-hidden="true"></span>Save as template after sending</label>
        <div style="height:14px"></div>
        <button id="sendBtn" class="btn btn-primary btn-block">Send to all users</button>
        <div id="resultBox" style="margin-top:14px"></div>
      </div>
      <div class="glass card" style="margin-bottom:0">
        <h3 class="card-title">Saved templates</h3>
        <div id="tplList">Loading...</div>
      </div>
    </div>
    <div class="glass card">
      <h3 class="card-title">History</h3>
      <div class="table-wrap">
        <table class="data">
          <thead><tr><th>Title</th><th>Message</th><th>Sent at</th><th>Sent by</th><th>Result</th></tr></thead>
          <tbody id="histRows"></tbody>
        </table>
      </div>
      <div class="card-list" id="histCards"></div>
      <div class="pager">
        <button id="prevBtn" class="btn btn-secondary btn-sm">Previous</button>
        <span id="pageInfo">Page 1</span>
        <button id="nextBtn" class="btn btn-secondary btn-sm">Next</button>
      </div>
    </div>
  </main>
</div>
<script src="api.js"></script>
<script src="ui.js"></script>
<script>
  Api.requireAuth();
  UI.initDrawer();
  document.querySelectorAll('[data-icon]').forEach((el) => { el.innerHTML = UI.icon(el.getAttribute('data-icon')); });
  document.getElementById('logoutBtn').addEventListener('click', () => Api.logout());
  document.getElementById('menuBtn').innerHTML = UI.icon('menu');
  const errorBox = document.getElementById('errorBox');
  const titleEl = document.getElementById('title');
  const bodyEl = document.getElementById('body');
  const imageEl = document.getElementById('imageUrl');
  const saveTplEl = document.getElementById('saveTpl');
  const sendBtn = document.getElementById('sendBtn');
  const resultBox = document.getElementById('resultBox');
  const tplPicker = document.getElementById('tplPicker');
  const tplList = document.getElementById('tplList');
  const histRows = document.getElementById('histRows');
  const histCards = document.getElementById('histCards');
  const pageInfo = document.getElementById('pageInfo');
  const imgPreview = document.getElementById('imgPreview');
  const imgHint = document.getElementById('imgHint');
  let templates = [];
  let page = 1;
  const LIMIT = 20;
  let total = 0;

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
  }
  titleEl.addEventListener('input', () => { document.getElementById('titleCount').textContent = String(titleEl.value.length); });
  bodyEl.addEventListener('input', () => { document.getElementById('bodyCount').textContent = String(bodyEl.value.length); });
  imageEl.addEventListener('input', () => {
    const v = imageEl.value.trim();
    if (v.startsWith('https://')) {
      imgPreview.src = v;
      imgPreview.style.display = 'block';
      imgHint.textContent = 'Preview loading...';
    } else {
      imgPreview.style.display = 'none';
      imgPreview.removeAttribute('src');
      imgHint.textContent = v ? 'Only https:// URLs are accepted.' : 'A small preview appears when the URL loads.';
    }
  });
  imgPreview.addEventListener('load', () => { imgHint.textContent = 'Preview loaded.'; });
  imgPreview.addEventListener('error', () => { imgHint.textContent = 'That URL did not load as an image.'; });

  function paintResult(r) {
    resultBox.innerHTML = '<div class="inline-ok">Broadcast finished.</div>'
      + '<div class="result-card"><div class="result-cell"><b style="color:var(--success)">' + r.successCount + '</b>Sent</div>'
      + '<div class="result-cell"><b style="color:' + (r.failureCount ? 'var(--danger)' : 'var(--text-secondary)') + '">' + r.failureCount + '</b>Failed</div></div>'
      + (r.failureReason ? '<details class="fail-detail"><summary>Failure details</summary><div>' + UI.esc(r.failureReason) + '</div></details>' : '');
  }

  async function loadTemplates() {
    try {
      templates = await Api.get('/notifications/templates');
      tplPicker.innerHTML = '<option value="">— No template —</option>' + templates.map((t) =>
        '<option value="' + UI.esc(t.id) + '">' + UI.esc(t.title) + '</option>').join('');
      tplList.innerHTML = templates.length ? templates.map((t) =>
        '<div class="tpl-item"><span><b>' + UI.esc(t.title) + '</b><br/><span style="color:var(--text-secondary)">' + UI.esc(t.body) + '</span></span>'
        + '<span style="display:flex;gap:6px;flex-shrink:0"><button data-use="' + UI.esc(t.id) + '" class="btn btn-secondary btn-sm">Use</button>'
        + '<button data-deltpl="' + UI.esc(t.id) + '" class="btn btn-danger btn-sm">Delete</button></span></div>').join('')
        : UI.emptyState('No templates yet.', 'Tick "Save as template" when sending to reuse a message.');
      tplList.querySelectorAll('[data-use]').forEach((b) => b.addEventListener('click', () => {
        const t = templates.find((x) => x.id === b.getAttribute('data-use'));
        if (t) {
          titleEl.value = t.title || '';
          bodyEl.value = t.body || '';
          imageEl.value = t.imageUrl || '';
          titleEl.dispatchEvent(new Event('input'));
          bodyEl.dispatchEvent(new Event('input'));
          imageEl.dispatchEvent(new Event('input'));
        }
      }));
      tplList.querySelectorAll('[data-deltpl]').forEach((b) => b.addEventListener('click', () => {
        const t = templates.find((x) => x.id === b.getAttribute('data-deltpl'));
        UI.confirmModal('Delete this template?', '"' + ((t && t.title) || '') + '" will be removed permanently.', 'Delete', true, async () => {
          await Api.del('/notifications/templates/' + encodeURIComponent(b.getAttribute('data-deltpl')));
          UI.toast('ok', 'Template deleted.');
          loadTemplates();
        });
      }));
    } catch (err) {
      showError(err.message);
    }
  }
  tplPicker.addEventListener('change', () => {
    const t = templates.find((x) => x.id === tplPicker.value);
    if (t) {
      titleEl.value = t.title || '';
      bodyEl.value = t.body || '';
      imageEl.value = t.imageUrl || '';
      titleEl.dispatchEvent(new Event('input'));
      bodyEl.dispatchEvent(new Event('input'));
      imageEl.dispatchEvent(new Event('input'));
    }
  });

  sendBtn.addEventListener('click', () => {
    errorBox.style.display = 'none';
    const title = titleEl.value.trim();
    const body = bodyEl.value.trim();
    const image = imageEl.value.trim();
    if (!title || !body) {
      showError('Title and message are both required.');
      return;
    }
    if (image && !image.startsWith('https://')) {
      showError('Image URL must start with https:// (or leave it empty).');
      return;
    }
    UI.confirmModal('Send to all users?', 'This notifies every installed device.', 'Send now', false, async () => {
      UI.setLoading(sendBtn, true, 'Sending...');
      resultBox.innerHTML = '';
      try {
        const payload = { title, body };
        if (image) payload.imageUrl = image;
        const result = await Api.post('/notifications/send', payload);
        if (saveTplEl.checked) {
          await Api.post('/notifications/templates', payload);
          loadTemplates();
        }
        paintResult({ successCount: result.successCount, failureCount: result.failureCount });
        UI.toast(result.failureCount ? 'info' : 'ok', 'Broadcast sent. ' + result.successCount + ' sent, ' + result.failureCount + ' failed.');
        titleEl.value = '';
        bodyEl.value = '';
        titleEl.dispatchEvent(new Event('input'));
        bodyEl.dispatchEvent(new Event('input'));
        loadHistory();
      } catch (err) {
        // The backend message already carries the REAL FCM reason.
        const m = err.message || 'Notification could not be sent.';
        paintResult({ successCount: 0, failureCount: 1, failureReason: m.replace(/^Notification could not be sent:\s*/, '') });
        UI.toast('err', m);
      } finally {
        UI.setLoading(sendBtn, false);
      }
    });
  });

  function histChips(n) {
    return '<span class="chip chip-green">' + n.successCount + ' sent</span> '
      + '<span class="chip ' + (n.failureCount ? 'chip-red' : 'chip-grey') + '">' + n.failureCount + ' failed</span>';
  }
  async function loadHistory() {
    histRows.innerHTML = '<tr><td colspan="5">' + UI.skeletonRows(0, 5) + '</td></tr>';
    histCards.innerHTML = UI.skeletonRows(0, 3);
    try {
      const data = await Api.get('/notifications/history?page=' + page + '&limit=' + LIMIT);
      total = data.total;
      pageInfo.textContent = UI.pagerText(page, LIMIT, total, 'broadcasts');
      if (!data.notifications.length) {
        const empty = UI.emptyState('No broadcasts yet.', 'Your sent broadcasts will appear here.');
        histRows.innerHTML = '<tr><td colspan="5">' + empty + '</td></tr>';
        histCards.innerHTML = empty;
        return;
      }
      histRows.innerHTML = data.notifications.map((n) =>
        '<tr><td><b>' + UI.esc(n.title) + '</b>' + (n.error ? '<br/><span style="color:var(--danger);font-size:12px">' + UI.esc(String(n.error).slice(0, 140)) + '</span>' : '')
        + '</td><td style="color:var(--text-secondary)">' + UI.esc(n.body) + '</td>'
        + '<td style="color:var(--text-secondary)">' + UI.esc(UI.fmtDate(n.sentAt)) + '</td>'
        + '<td>' + UI.esc(n.sentBy) + '</td><td>' + histChips(n) + '</td></tr>').join('');
      histCards.innerHTML = data.notifications.map((n) =>
        '<div class="row-card"><div class="row-title">' + UI.esc(n.title) + '</div>'
        + '<div style="color:var(--text-secondary);font-size:13px;margin-bottom:6px">' + UI.esc(n.body) + '</div>'
        + '<div class="kv"><span>Sent at</span><span>' + UI.esc(UI.fmtDate(n.sentAt)) + '</span></div>'
        + '<div class="kv"><span>By</span><span>' + UI.esc(n.sentBy) + '</span></div>'
        + (n.error ? '<div class="kv"><span>Error</span><span style="color:var(--danger)">' + UI.esc(String(n.error).slice(0, 140)) + '</span></div>' : '')
        + '<div style="margin-top:8px">' + histChips(n) + '</div></div>').join('');
    } catch (err) {
      showError(err.message);
      histRows.innerHTML = '<tr><td colspan="5">' + UI.errorState(err.message) + '</td></tr>';
      histCards.innerHTML = UI.errorState(err.message);
      document.querySelectorAll('[data-retry]').forEach((b) => b.addEventListener('click', loadHistory));
    }
  }
  document.getElementById('prevBtn').addEventListener('click', () => { if (page > 1) { page -= 1; loadHistory(); } });
  document.getElementById('nextBtn').addEventListener('click', () => { if (page * LIMIT < total) { page += 1; loadHistory(); } });
  loadTemplates();
  loadHistory();
</script>
</body>
</html>
