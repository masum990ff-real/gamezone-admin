<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Game Zone Admin — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<div class="center-wrap">
  <div class="glass login-card">
    <h1>GAME <b>ZONE</b></h1>
    <p class="sub">Admin Panel — sign in to continue</p>
    <div id="errorBox" class="inline-err" style="display:none"></div>
    <div class="field-row">
      <label class="label" for="email">Email</label>
      <input id="email" type="email" autocomplete="username" class="field" placeholder="admin@example.com" />
    </div>
    <div class="field-row">
      <label class="label" for="password">Password</label>
      <div style="position:relative">
        <input id="password" type="password" autocomplete="current-password" class="field" placeholder="Password" style="padding-right:52px" />
        <button id="showBtn" class="btn btn-secondary btn-sm" type="button" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);min-height:36px" aria-label="Show password">Show</button>
      </div>
    </div>
    <button id="loginBtn" class="btn btn-primary btn-block" style="margin-top:8px">Login</button>
  </div>
</div>
<script src="api.js"></script>
<script src="ui.js"></script>
<script>
  if (Api.isLoggedIn()) window.location.href = 'index.html';
  const emailEl = document.getElementById('email');
  const passwordEl = document.getElementById('password');
  const loginBtn = document.getElementById('loginBtn');
  const errorBox = document.getElementById('errorBox');
  const showBtn = document.getElementById('showBtn');

  showBtn.addEventListener('click', () => {
    const show = passwordEl.type === 'password';
    passwordEl.type = show ? 'text' : 'password';
    showBtn.textContent = show ? 'Hide' : 'Show';
    showBtn.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
  }
  async function doLogin() {
    errorBox.style.display = 'none';
    UI.setLoading(loginBtn, true, 'Signing in...');
    try {
      const email = emailEl.value.trim();
      if (!email || !passwordEl.value) {
        showError('Email and password are required.');
        UI.setLoading(loginBtn, false);
        return;
      }
      await Api.login(email, passwordEl.value);
      window.location.href = 'index.html';
    } catch (err) {
      showError(err.message);
      UI.setLoading(loginBtn, false);
    }
  }
  loginBtn.addEventListener('click', doLogin);
  passwordEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
  emailEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
