<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Game Zone Admin — Users</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<div class="layout">
  <aside class="sidebar" aria-label="Admin navigation">
    <div class="brand">GAME <b>ZONE</b></div>
    <a href="index.html" class="navlink"><span data-icon="dashboard"></span>Dashboard</a>
    <a href="users.html" class="navlink active"><span data-icon="users"></span>Users</a>
    <a href="notifications.html" class="navlink"><span data-icon="bell"></span>Notifications</a>
    <button id="logoutBtn" class="navlink" style="margin-top:auto;background:none;border:none;cursor:pointer;text-align:left;width:100%"><span data-icon="logout"></span>Logout</button>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <div class="topbar">
      <button id="menuBtn" class="btn btn-secondary btn-sm menu-btn" aria-label="Open navigation">Menu</button>
      <h2>Users</h2>
    </div>
    <div class="info-note">Passwords live only in Firebase Authentication (hashed by Google) and are never stored or shown here. Bans take effect on the user&apos;s next login or app start.</div>
    <div id="errorBox" class="inline-err" style="display:none"></div>
    <div class="glass card">
      <div class="table-wrap">
        <table class="data">
          <thead><tr><th>Username</th><th>Email</th><th>Mobile</th><th>Wallet</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead>
          <tbody id="userRows"></tbody>
        </table>
      </div>
      <div class="card-list" id="userCards"></div>
      <div class="pager">
        <button id="prevBtn" class="btn btn-secondary btn-sm">Previous</button>
        <span id="pageInfo">Page 1</span>
        <button id="nextBtn" class="btn btn-secondary btn-sm">Next</button>
      </div>
    </div>
  </main>
</div>
<script src="api.js"></script>
<script src="ui.js"></script>
<script>
  Api.requireAuth();
  UI.initDrawer();
  document.querySelectorAll('[data-icon]').forEach((el) => { el.innerHTML = UI.icon(el.getAttribute('data-icon')); });
  document.getElementById('logoutBtn').addEventListener('click', () => Api.logout());
  document.getElementById('menuBtn').innerHTML = UI.icon('menu');
  const errorBox = document.getElementById('errorBox');
  const userRows = document.getElementById('userRows');
  const userCards = document.getElementById('userCards');
  const pageInfo = document.getElementById('pageInfo');
  let page = 1;
  const LIMIT = 20;
  let total = 0;
  // Live row cache so ban/unban updates in place without a full reload.
  let cache = [];

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.style.display = 'block';
  }
  function statusChip(u) {
    return u.isBanned ? '<span class="chip chip-red">Banned</span>' : '<span class="chip chip-green">Active</span>';
  }
  function actionBtn(u) {
    return u.isBanned
      ? '<button data-unban="' + UI.esc(u.id) + '" class="btn btn-primary btn-sm">Unban</button>'
      : '<button data-ban="' + UI.esc(u.id) + '" class="btn btn-danger btn-sm">Ban</button>';
  }
  function paint() {
    pageInfo.textContent = UI.pagerText(page, LIMIT, total, 'users');
    userRows.innerHTML = cache.map((u) =>
      '<tr><td><b>' + UI.esc(u.username) + '</b><br/><span style="color:var(--text-secondary);font-size:12px">' + UI.esc(u.firstName || '') + ' ' + UI.esc(u.lastName || '') + '</span></td>'
      + '<td>' + UI.esc(u.email) + '</td><td>' + UI.esc(u.phone || '—') + '</td><td>' + UI.esc(u.walletBalance) + '</td>'
      + '<td>' + statusChip(u) + '</td><td style="color:var(--text-secondary)">' + UI.esc(UI.fmtDate(u.createdAt)) + '</td>'
      + '<td>' + actionBtn(u) + '</td></tr>').join('');
    userCards.innerHTML = cache.map((u) =>
      '<div class="row-card"><div class="row-title">' + UI.esc(u.username) + ' ' + statusChip(u) + '</div>'
      + '<div class="kv"><span>Email</span><span>' + UI.esc(u.email) + '</span></div>'
      + '<div class="kv"><span>Mobile</span><span>' + UI.esc(u.phone || '—') + '</span></div>'
      + '<div class="kv"><span>Wallet</span><span>' + UI.esc(u.walletBalance) + '</span></div>'
      + '<div class="kv"><span>Joined</span><span>' + UI.esc(UI.fmtDate(u.createdAt)) + '</span></div>'
      + '<div class="row-actions">' + actionBtn(u) + '</div></div>').join('');
    bindActions();
  }
  function bindActions() {
    userRows.querySelectorAll('[data-ban]').forEach((b) => b.addEventListener('click', () => openBan(b.getAttribute('data-ban'))));
    userRows.querySelectorAll('[data-unban]').forEach((b) => b.addEventListener('click', () => openUnban(b.getAttribute('data-unban'))));
    userCards.querySelectorAll('[data-ban]').forEach((b) => b.addEventListener('click', () => openBan(b.getAttribute('data-ban'))));
    userCards.querySelectorAll('[data-unban]').forEach((b) => b.addEventListener('click', () => openUnban(b.getAttribute('data-unban'))));
  }
  async function load() {
    errorBox.style.display = 'none';
    userRows.innerHTML = '<tr><td colspan="7">' + UI.skeletonRows(0, 5) + '</td></tr>';
    userCards.innerHTML = UI.skeletonRows(0, 3);
    try {
      const data = await Api.get('/users?page=' + page + '&limit=' + LIMIT);
      total = data.total;
      cache = data.users;
      if (!cache.length) {
        const empty = UI.emptyState('No users found.', 'New signups will appear here.');
        userRows.innerHTML = '<tr><td colspan="7">' + empty + '</td></tr>';
        userCards.innerHTML = empty;
        pageInfo.textContent = UI.pagerText(page, LIMIT, total, 'users');
        return;
      }
      paint();
    } catch (err) {
      showError(err.message);
      userRows.innerHTML = '<tr><td colspan="7">' + UI.errorState(err.message) + '</td></tr>';
      userCards.innerHTML = UI.errorState(err.message);
      bindRetry();
    }
  }
  function bindRetry() {
    document.querySelectorAll('[data-retry]').forEach((b) => b.addEventListener('click', load));
  }
  function findUser(id) {
    return cache.find((u) => u.id === id) || { id, username: '', email: '' };
  }
  function openBan(id) {
    const u = findUser(id);
    UI.reasonModal((u.username || 'User') + ' — ' + (u.email || ''), async (reason) => {
      await Api.post('/users/' + encodeURIComponent(id) + '/ban', { reason });
      const row = cache.find((x) => x.id === id);
      if (row) { row.isBanned = true; paint(); }
      UI.toast('ok', 'User banned.');
    });
  }
  function openUnban(id) {
    const u = findUser(id);
    UI.confirmModal('Unban this user?', (u.username || 'This user') + ' will be able to log in again.', 'Unban', false, async () => {
      await Api.post('/users/' + encodeURIComponent(id) + '/unban', {});
      const row = cache.find((x) => x.id === id);
      if (row) { row.isBanned = false; paint(); }
      UI.toast('ok', 'User unbanned.');
    });
  }
  document.getElementById('prevBtn').addEventListener('click', () => { if (page > 1) { page -= 1; load(); } });
  document.getElementById('nextBtn').addEventListener('click', () => { if (page * LIMIT < total) { page += 1; load(); } });
  load();
</script>
</body>
</html>
