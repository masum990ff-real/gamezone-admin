<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Game Zone Admin — Users</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #050505; }
  .card { background: #14161B; border: 1px solid #262B33; }
  .accent { color: #FF7A00; }
  .nav-active { background: #1C1214; border-color: #FF7A00 !important; color: #FF7A00; }
  .btn-primary { background: #00E676; color: #06110B; }
  .btn-danger { background: #7F1D1D; color: #FECACA; border: 1px solid #B91C1C; }
  table th, table td { padding: 10px 12px; text-align: left; }
</style>
</head>
<body class="min-h-screen text-gray-100">
<div class="flex min-h-screen">
  <aside class="w-56 shrink-0 border-r border-gray-800 p-4 flex flex-col gap-2">
    <h1 class="text-xl font-extrabold tracking-wide px-2 mb-4">GAME <span class="accent">ZONE</span></h1>
    <a href="index.html" class="rounded-lg px-3 py-2 border border-transparent text-gray-300 hover:bg-gray-900">Dashboard</a>
    <a href="users.html" class="nav-active rounded-lg px-3 py-2 border border-transparent">Users</a>
    <a href="notifications.html" class="rounded-lg px-3 py-2 border border-transparent text-gray-300 hover:bg-gray-900">Notifications</a>
    <button id="logoutBtn" class="mt-auto rounded-lg px-3 py-2 text-left text-gray-400 hover:bg-gray-900">Logout</button>
  </aside>
  <main class="flex-1 p-6 min-w-0">
    <h2 class="text-2xl font-bold mb-6">Users</h2>
    <p class="text-sm text-gray-400 mb-4">Passwords live only in Firebase Authentication (hashed by Google) and are never stored or shown here. Bans take effect on the user&apos;s next login or app start.</p>
    <div id="errorBox" class="hidden mb-4 text-sm text-red-300 bg-red-950 border border-red-800 rounded-lg px-3 py-2"></div>
    <div class="card rounded-2xl p-5">
      <div class="overflow-x-auto">
      <table class="w-full text-sm min-w-[960px]">
        <thead class="text-gray-400">
          <tr class="border-b border-gray-800">
            <th>Username</th><th>First name</th><th>Last name</th><th>Mobile</th>
            <th>Email</th><th>Wallet</th><th>Banned</th><th>Created</th><th>Actions</th>
          </tr>
        </thead>
        <tbody id="userRows"><tr><td colspan="9" class="text-gray-500">Loading...</td></tr></tbody>
      </table>
      </div>
    </div>
    <div class="flex items-center gap-3 mt-4 text-sm">
      <button id="prevBtn" class="card rounded-lg px-4 py-2">Previous</button>
      <span id="pageInfo" class="text-gray-400">Page 1</span>
      <button id="nextBtn" class="card rounded-lg px-4 py-2">Next</button>
    </div>
  </main>
</div>
<script src="api.js"></script>
<script>
  Api.requireAuth();
  document.getElementById('logoutBtn').addEventListener('click', () => Api.logout());
  const errorBox = document.getElementById('errorBox');
  const userRows = document.getElementById('userRows');
  const pageInfo = document.getElementById('pageInfo');
  let page = 1;
  const LIMIT = 20;
  let total = 0;

  function showError(msg) {
    errorBox.textContent = msg;
    errorBox.classList.remove('hidden');
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }
  function fmtDate(v) {
    if (!v) return '—';
    const d = new Date(v);
    return isNaN(d) ? '—' : d.toLocaleString();
  }
  async function load() {
    errorBox.classList.add('hidden');
    userRows.innerHTML = '<tr><td colspan="9" class="text-gray-500">Loading...</td></tr>';
    try {
      const data = await Api.get('/users?page=' + page + '&limit=' + LIMIT);
      total = data.total;
      pageInfo.textContent = 'Page ' + data.page + ' of ' + Math.max(1, Math.ceil(total / LIMIT)) + ' (' + total + ' users)';
      userRows.innerHTML = data.users.length ? data.users.map((u) =>
        '<tr class="border-b border-gray-800">' +
        '<td>' + esc(u.username) + '</td><td>' + esc(u.firstName) + '</td><td>' + esc(u.lastName) + '</td>' +
        '<td>' + esc(u.phone) + '</td><td>' + esc(u.email) + '</td><td>' + esc(u.walletBalance) + '</td>' +
        '<td>' + (u.isBanned
          ? '<span class="text-red-400 font-bold">Banned</span>'
          : '<span class="text-green-400">Active</span>') + '</td>' +
        '<td class="text-gray-400">' + esc(fmtDate(u.createdAt)) + '</td>' +
        '<td>' + (u.isBanned
          ? '<button data-unban="' + esc(u.id) + '" class="btn-primary font-bold rounded-lg px-3 py-1 text-sm">Unban</button>'
          : '<button data-ban="' + esc(u.id) + '" class="btn-danger font-bold rounded-lg px-3 py-1 text-sm">Ban</button>') + '</td></tr>'
      ).join('') : '<tr><td colspan="9" class="text-gray-500">No users found.</td></tr>';
      userRows.querySelectorAll('[data-ban]').forEach((btn) =>
        btn.addEventListener('click', () => banUser(btn.getAttribute('data-ban'))));
      userRows.querySelectorAll('[data-unban]').forEach((btn) =>
        btn.addEventListener('click', () => unbanUser(btn.getAttribute('data-unban'))));
    } catch (err) {
      showError(err.message);
    }
  }
  async function banUser(id) {
    const reason = window.prompt('Enter the ban reason (shown to the user):');
    if (reason === null) return;
    if (!reason.trim()) { showError('A ban reason is required.'); return; }
    try {
      await Api.post('/users/' + encodeURIComponent(id) + '/ban', { reason: reason.trim() });
      load();
    } catch (err) {
      showError(err.message);
    }
  }
  async function unbanUser(id) {
    if (!window.confirm('Unban this user?')) return;
    try {
      await Api.post('/users/' + encodeURIComponent(id) + '/unban', {});
      load();
    } catch (err) {
      showError(err.message);
    }
  }
  document.getElementById('prevBtn').addEventListener('click', () => { if (page > 1) { page -= 1; load(); } });
  document.getElementById('nextBtn').addEventListener('click', () => {
    if (page * LIMIT < total) { page += 1; load(); }
  });
  load();
</script>
</body>
</html>
